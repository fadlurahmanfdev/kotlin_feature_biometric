[github_app]
handle_push_trigger = true
push_commands = [
    "/agentic_review"
]

[pr_code_suggestions]
enable_chat_in_code_suggestions = true

[config]
allow_only_specific_folders=['.github','app', 'gradle', 'mark_biometric']

[review_agent]
issues_user_guidelines = """
Android/Kotlin project rules:

- Use Clean Architecture
- Implement SOLID Principle
- Avoid Context leaks
"""
